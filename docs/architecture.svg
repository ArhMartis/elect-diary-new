<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 Z" fill="#16a34a"/>
    </marker>
    <linearGradient id="browserG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#4f46e5"/></linearGradient>
    <linearGradient id="nextG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2563eb"/><stop offset="100%" style="stop-color:#1d4ed8"/></linearGradient>
    <linearGradient id="drizzleG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#d97706"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="sqliteG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#059669"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
  </defs>

  <rect width="800" height="420" fill="#f8fafc" rx="12"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Клиент-серверная архитектура (Next.js + SQLite)</text>

  <!-- Browser -->
  <rect x="270" y="60" width="260" height="60" rx="14" fill="url(#browserG)" stroke="#4338ca" stroke-width="2"/>
  <text x="400" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">🌐 Браузер пользователя</text>
  <text x="400" y="104" text-anchor="middle" font-size="11" fill="#e0e7ff">Клиентская часть (JavaScript / React)</text>

  <!-- Arrow down: Request -->
  <line x1="400" y1="120" x2="400" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="415" y="150" font-size="11" fill="#2563eb" font-weight="bold">Запрос (HTTP)</text>

  <!-- Next.js -->
  <rect x="240" y="170" width="320" height="60" rx="14" fill="url(#nextG)" stroke="#1e40af" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">⚡ Next.js (App Router)</text>
  <text x="400" y="214" text-anchor="middle" font-size="11" fill="#dbeafe">Серверные компоненты / Server Actions</text>

  <!-- Arrow down: Query -->
  <line x1="400" y1="230" x2="400" y2="280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="415" y="260" font-size="11" fill="#2563eb" font-weight="bold">Запрос (SQL)</text>

  <!-- Drizzle ORM -->
  <rect x="280" y="280" width="240" height="50" rx="12" fill="url(#drizzleG)" stroke="#92400e" stroke-width="2"/>
  <text x="400" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">🗄️ Drizzle ORM</text>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#fef3c7">Слой доступа к данным</text>

  <!-- Arrow down -->
  <line x1="400" y1="330" x2="400" y2="370" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <!-- SQLite -->
  <rect x="290" y="370" width="220" height="45" rx="12" fill="url(#sqliteG)" stroke="#065f46" stroke-width="2"/>
  <text x="400" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">📁 SQLite (sqlite.db)</text>
  <text x="400" y="405" text-anchor="middle" font-size="11" fill="#a7f3d0">Файловая база данных</text>

  <!-- Arrow up: Response -->
  <line x1="380" y1="375" x2="380" y2="330" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowL)"/>
  <line x1="380" y1="285" x2="380" y2="235" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowL)"/>
  <line x1="380" y1="175" x2="380" y2="125" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="340" y="295" font-size="11" fill="#16a34a" font-weight="bold">Данные (JSON)</text>

  <!-- Side note -->
  <text x="400" y="415" text-anchor="middle" font-size="11" fill="#94a3b8">Запрос → Обработка → База данных → Ответ (полный цикл)</text>
</svg>