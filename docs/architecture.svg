<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <linearGradient id="browserG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#4f46e5"/></linearGradient>
    <linearGradient id="nextG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2563eb"/><stop offset="100%" style="stop-color:#1d4ed8"/></linearGradient>
    <linearGradient id="drizzleG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#d97706"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="sqliteG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#059669"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
  </defs>

  <rect width="800" height="480" fill="#f8fafc" rx="12"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Клиент-серверная архитектура (Next.js + SQLite)</text>

  <!-- Browser -->
  <rect x="250" y="55" width="300" height="60" rx="14" fill="url(#browserG)" stroke="#4338ca" stroke-width="2"/>
  <text x="400" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">🌐 Браузер пользователя</text>
  <text x="400" y="99" text-anchor="middle" font-size="11" fill="#e0e7ff">Клиентская часть (JavaScript / React)</text>

  <!-- Request arrow (blue) -->
  <line x1="440" y1="115" x2="440" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="455" y="145" font-size="11" fill="#2563eb" font-weight="bold">Запрос (HTTP)</text>

  <!-- Next.js -->
  <rect x="210" y="165" width="380" height="60" rx="14" fill="url(#nextG)" stroke="#1e40af" stroke-width="2"/>
  <text x="400" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">⚡ Next.js (App Router)</text>
  <text x="400" y="209" text-anchor="middle" font-size="11" fill="#dbeafe">Серверные компоненты / Server Actions</text>

  <!-- Query arrow (blue) -->
  <line x1="440" y1="225" x2="440" y2="275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="455" y="255" font-size="11" fill="#2563eb" font-weight="bold">Запрос (SQL)</text>

  <!-- Drizzle ORM -->
  <rect x="240" y="275" width="320" height="50" rx="12" fill="url(#drizzleG)" stroke="#92400e" stroke-width="2"/>
  <text x="400" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">🗄️ Drizzle ORM</text>
  <text x="400" y="313" text-anchor="middle" font-size="11" fill="#fef3c7">Слой доступа к данным</text>

  <!-- Query arrow (blue) -->
  <line x1="440" y1="325" x2="440" y2="370" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <!-- SQLite -->
  <rect x="270" y="370" width="260" height="45" rx="12" fill="url(#sqliteG)" stroke="#065f46" stroke-width="2"/>
  <text x="400" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">📁 SQLite (sqlite.db)</text>
  <text x="400" y="405" text-anchor="middle" font-size="11" fill="#a7f3d0">Файловая база данных</text>

  <!-- Response arrows (green) - going up on the LEFT side -->
  <path d="M 360 395 L 360 350 L 350 350" stroke="#16a34a" stroke-width="2" fill="none"/>
  <polygon points="350,350 358,345 358,355" fill="#16a34a"/>

  <path d="M 350 300 L 350 200 L 350 200" stroke="#16a34a" stroke-width="2" fill="none"/>
  <polygon points="350,200 358,195 358,205" fill="#16a34a"/>

  <path d="M 350 145 L 350 115" stroke="#16a34a" stroke-width="2" fill="none"/>
  <polygon points="350,115 358,110 358,120" fill="#16a34a"/>

  <text x="170" y="350" font-size="11" fill="#16a34a" font-weight="bold">Данные</text>
  <text x="170" y="365" font-size="11" fill="#16a34a" font-weight="bold">(JSON)</text>

  <text x="400" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">Запрос → Обработка → База данных → Ответ (полный цикл)</text>
</svg>