<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrow-lg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/></marker>
    <linearGradient id="hdr1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/><stop offset="100%" stop-color="#db2777"/></linearGradient>
    <linearGradient id="hdr3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="hdr4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="hdr5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
  </defs>

  <rect width="1400" height="1100" fill="#f1f5f9" rx="8"/>
  <text x="700" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">ER-диаграмма базы данных — «KnowledgeBY» (Электронный дневник)</text>
  <text x="700" y="55" text-anchor="middle" font-size="12" fill="#64748b">18 основных таблиц | FK — внешний ключ | PK — первичный ключ</text>

  <!-- ===== TABLES ===== -->

  <!-- 1. USER — central -->
  <g transform="translate(520, 80)">
    <rect width="320" height="200" rx="8" fill="white" stroke="#a5b4fc" stroke-width="2"/>
    <rect width="320" height="34" rx="8" fill="url(#hdr1)"/>
    <rect width="320" height="6" y="28" fill="url(#hdr1)"/>
    <text x="160" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="white">👤 Пользователи (user) — центральная таблица</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK) — UUID</text>
    <text x="14" y="73" font-size="11" fill="#1e293b" font-weight="bold">full_name — ФИО</text>
    <text x="14" y="91" font-size="11" fill="#1e293b" font-weight="bold">email (unique) — логин</text>
    <text x="14" y="109" font-size="11" fill="#1e293b" font-weight="bold">role — admin / principal / teacher / student / parent</text>
    <text x="14" y="127" font-size="11" fill="#64748b">name — login, avatar — аватар</text>
    <text x="14" y="145" font-size="11" fill="#64748b">created_at, updated_at, last_seen</text>
    <text x="14" y="163" font-size="11" fill="#6366f1" font-weight="bold">group_id (FK → groups.id) — класс ученика</text>
    <text x="14" y="181" font-size="11" fill="#64748b">banned, two_factor_enabled</text>
  </g>

  <!-- 2. GROUPS — wider -->
  <g transform="translate(150, 120)">
    <rect width="280" height="140" rx="8" fill="white" stroke="#f9a8d4" stroke-width="2"/>
    <rect width="280" height="34" rx="8" fill="url(#hdr2)"/>
    <text x="140" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🏫 Классы (groups)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#1e293b" font-weight="bold">name — название (9-А)</text>
    <text x="14" y="91" font-size="11" fill="#db2777" font-weight="bold">teacher_id (FK → user.id) — кл. руководитель</text>
    <text x="14" y="113" font-size="10" fill="#64748b">Ученики: user WHERE role=student AND group_id=groups.id</text>
  </g>

  <!-- ARROW: user.group_id → groups.id -->
  <line x1="520" y1="210" x2="430" y2="195" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-lg)"/>
  <text x="465" y="190" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="bold">FK group_id</text>

  <!-- ARROW: groups.teacher_id → user.id -->
  <line x1="290" y1="120" x2="520" y2="130" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="115" font-size="9" fill="#db2777" text-anchor="middle" font-weight="bold">FK teacher_id</text>

  <!-- 3. SUBJECTS -->
  <g transform="translate(960, 100)">
    <rect width="260" height="140" rx="8" fill="white" stroke="#5eead4" stroke-width="2"/>
    <rect width="260" height="34" rx="8" fill="url(#hdr3)"/>
    <text x="130" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📚 Предметы (subjects)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#1e293b" font-weight="bold">name — название предмета</text>
    <text x="14" y="91" font-size="11" fill="#1e293b" font-weight="bold">type — regular / elective / olympiad</text>
    <text x="14" y="109" font-size="11" fill="#64748b">grade_type — numeric / passfail</text>
  </g>

  <!-- 4. SCHEDULE — directly below SUBJECTS -->
  <g transform="translate(960, 280)">
    <rect width="260" height="160" rx="8" fill="white" stroke="#fcd34d" stroke-width="2"/>
    <rect width="260" height="34" rx="8" fill="url(#hdr4)"/>
    <text x="130" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📅 Расписание (schedule)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#d97706" font-weight="bold">group_id (FK → groups.id)</text>
    <text x="14" y="91" font-size="11" fill="#d97706" font-weight="bold">subject_id (FK → subjects.id)</text>
    <text x="14" y="109" font-size="11" fill="#d97706" font-weight="bold">teacher_id (FK → user.id)</text>
    <text x="14" y="127" font-size="11" fill="#64748b">day_of_week, lesson_number, quarter</text>
    <text x="14" y="145" font-size="11" fill="#64748b">lesson_date — конкретная дата</text>
  </g>

  <!-- SHORT ARROW: schedule.subject_id → subjects.id -->
  <line x1="1060" y1="280" x2="1090" y2="240" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1110" y="265" font-size="9" fill="#d97706" font-weight="bold">FK subject_id</text>

  <!-- SHORT ARROW: schedule.teacher_id → user.id -->
  <line x1="960" y1="350" x2="840" y2="220" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="880" y="290" font-size="9" fill="#d97706" font-weight="bold">FK teacher_id</text>

  <!-- SHORT ARROW: schedule.group_id → groups.id -->
  <line x1="960" y1="310" x2="430" y2="195" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="680" y="240" font-size="9" fill="#d97706" font-weight="bold">FK group_id</text>

  <!-- 5. GRADES — below USER -->
  <g transform="translate(200, 340)">
    <rect width="280" height="175" rx="8" fill="white" stroke="#fcd34d" stroke-width="2"/>
    <rect width="280" height="34" rx="8" fill="url(#hdr4)"/>
    <text x="140" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⭐ Оценки (grades)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#d97706" font-weight="bold">student_id (FK → user.id) — ученик</text>
    <text x="14" y="91" font-size="11" fill="#d97706" font-weight="bold">subject_id (FK → subjects.id)</text>
    <text x="14" y="109" font-size="11" fill="#d97706" font-weight="bold">teacher_id (FK → user.id)</text>
    <text x="14" y="127" font-size="11" fill="#1e293b" font-weight="bold">value — оценка</text>
    <text x="14" y="145" font-size="11" fill="#64748b">comment, date</text>
    <text x="14" y="163" font-size="11" fill="#64748b">academic_period_id</text>
  </g>

  <!-- SHORT ARROWS to/from GRADES -->
  <line x1="480" y1="340" x2="600" y2="280" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="310" font-size="9" fill="#d97706" font-weight="bold">FK student_id</text>

  <line x1="340" y1="515" x2="1020" y2="240" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="700" y="480" font-size="9" fill="#d97706" font-weight="bold">FK subject_id</text>

  <!-- 6. HOMEWORK — below SCHEDULE -->
  <g transform="translate(960, 480)">
    <rect width="260" height="160" rx="8" fill="white" stroke="#5eead4" stroke-width="2"/>
    <rect width="260" height="34" rx="8" fill="url(#hdr3)"/>
    <text x="130" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📝 ДЗ (homework)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#0d9488" font-weight="bold">teacher_id (FK → user.id)</text>
    <text x="14" y="91" font-size="11" fill="#0d9488" font-weight="bold">group_id (FK → groups.id)</text>
    <text x="14" y="109" font-size="11" fill="#0d9488" font-weight="bold">subject_id (FK → subjects.id)</text>
    <text x="14" y="127" font-size="11" fill="#1e293b" font-weight="bold">description — текст ДЗ</text>
    <text x="14" y="145" font-size="11" fill="#64748b">comment, due_date</text>
  </g>

  <!-- 7. ATTENDANCE -->
  <g transform="translate(600, 480)">
    <rect width="260" height="140" rx="8" fill="white" stroke="#fcd34d" stroke-width="2"/>
    <rect width="260" height="34" rx="8" fill="url(#hdr4)"/>
    <text x="130" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📋 Посещаемость (attendance_records)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#d97706" font-weight="bold">student_id (FK → user.id)</text>
    <text x="14" y="91" font-size="11" fill="#d97706" font-weight="bold">subject_id (FK → subjects.id)</text>
    <text x="14" y="109" font-size="11" fill="#1e293b" font-weight="bold">date, type — absent/unexcused/late</text>
  </g>

  <line x1="600" y1="520" x2="680" y2="280" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="400" font-size="9" fill="#d97706" font-weight="bold">FK student_id</text>

  <!-- 8. FINAL GRADES -->
  <g transform="translate(170, 560)">
    <rect width="280" height="175" rx="8" fill="white" stroke="#fcd34d" stroke-width="2"/>
    <rect width="280" height="34" rx="8" fill="url(#hdr4)"/>
    <text x="140" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="white">📊 Итоговые оценки (final_grades)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#d97706" font-weight="bold">student_id (FK → user.id)</text>
    <text x="14" y="91" font-size="11" fill="#d97706" font-weight="bold">subject_id (FK → subjects.id)</text>
    <text x="14" y="109" font-size="11" fill="#64748b">q1, q2, q3, q4, year, exam, final</text>
    <text x="14" y="127" font-size="11" fill="#1e293b" font-weight="bold">grade_type — numeric / passfail</text>
    <text x="14" y="145" font-size="11" fill="#64748b">unique(student_id + subject_id + year)</text>
  </g>

  <line x1="310" y1="560" x2="600" y2="245" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="460" y="540" font-size="9" fill="#d97706" font-weight="bold">FK student_id</text>

  <!-- 9. PARENTS_TO_STUDENTS — right of GRADES -->
  <g transform="translate(140, 770)">
    <rect width="280" height="110" rx="8" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="280" height="34" rx="8" fill="url(#hdr5)"/>
    <text x="140" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">👨‍👩‍👧 Родители-Ученики (parents_to_students)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#7c3aed" font-weight="bold">parent_id (FK → user.id) — родитель</text>
    <text x="14" y="91" font-size="11" fill="#7c3aed" font-weight="bold">student_id (FK → user.id) — ученик</text>
  </g>

  <line x1="280" y1="770" x2="650" y2="270" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="600" font-size="9" fill="#7c3aed" font-weight="bold">FK parent_id → user.id</text>

  <line x1="350" y1="880" x2="670" y2="270" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="530" y="650" font-size="9" fill="#7c3aed" font-weight="bold">FK student_id → user.id</text>

  <!-- 10. MESSAGES -->
  <g transform="translate(520, 770)">
    <rect width="280" height="160" rx="8" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="280" height="34" rx="8" fill="url(#hdr5)"/>
    <text x="140" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">💬 Сообщения (messages)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#7c3aed" font-weight="bold">sender_id (FK → user.id)</text>
    <text x="14" y="91" font-size="11" fill="#7c3aed" font-weight="bold">receiver_id (FK → user.id)</text>
    <text x="14" y="109" font-size="11" fill="#1e293b" font-weight="bold">content — текст</text>
    <text x="14" y="127" font-size="11" fill="#64748b">is_broadcast, read_at</text>
    <text x="14" y="145" font-size="11" fill="#64748b">file_url, file_name — вложения</text>
  </g>

  <line x1="660" y1="770" x2="720" y2="280" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="550" font-size="9" fill="#7c3aed" font-weight="bold">FK sender_id</text>
  <line x1="700" y1="930" x2="740" y2="280" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="740" y="620" font-size="9" fill="#7c3aed" font-weight="bold">FK receiver_id</text>

  <!-- 11. TEACHER_SUBJECTS -->
  <g transform="translate(960, 700)">
    <rect width="260" height="110" rx="8" fill="white" stroke="#a5b4fc" stroke-width="2"/>
    <rect width="260" height="34" rx="8" fill="url(#hdr1)"/>
    <text x="130" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔗 Учителя→Предметы (teacher_subjects)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#6366f1" font-weight="bold">teacher_id (FK → user.id)</text>
    <text x="14" y="91" font-size="11" fill="#6366f1" font-weight="bold">subject_id (FK → subjects.id)</text>
  </g>

  <line x1="960" y1="740" x2="840" y2="230" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="500" font-size="9" fill="#6366f1" font-weight="bold">FK teacher_id</text>

  <line x1="1090" y1="700" x2="1110" y2="240" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1130" y="480" font-size="9" fill="#6366f1" font-weight="bold">FK subject_id</text>

  <!-- 12. TEACHER_CLASSES -->
  <g transform="translate(960, 850)">
    <rect width="260" height="110" rx="8" fill="white" stroke="#a5b4fc" stroke-width="2"/>
    <rect width="260" height="34" rx="8" fill="url(#hdr1)"/>
    <text x="130" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔗 Учителя→Классы (teacher_classes)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#6366f1" font-weight="bold">teacher_id (FK → user.id)</text>
    <text x="14" y="91" font-size="11" fill="#6366f1" font-weight="bold">group_id (FK → groups.id)</text>
  </g>

  <line x1="960" y1="890" x2="430" y2="230" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="700" y="870" font-size="9" fill="#6366f1" font-weight="bold">FK group_id</text>

  <!-- 13. GROUP_SUBJECTS -->
  <g transform="translate(30, 920)">
    <rect width="260" height="110" rx="8" fill="white" stroke="#5eead4" stroke-width="2"/>
    <rect width="260" height="34" rx="8" fill="url(#hdr3)"/>
    <text x="130" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔗 Классы→Предметы (group_subjects)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#0d9488" font-weight="bold">group_id (FK → groups.id)</text>
    <text x="14" y="91" font-size="11" fill="#0d9488" font-weight="bold">subject_id (FK → subjects.id)</text>
  </g>

  <line x1="210" y1="920" x2="280" y2="260" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="550" font-size="9" fill="#0d9488" font-weight="bold">FK group_id</text>

  <!-- 14. ELECTIVES -->
  <g transform="translate(380, 920)">
    <rect width="280" height="110" rx="8" fill="white" stroke="#5eead4" stroke-width="2"/>
    <rect width="280" height="34" rx="8" fill="url(#hdr3)"/>
    <text x="140" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🏆 Факультативы (electives)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#1e293b" font-weight="bold">name — название, schedule</text>
    <text x="14" y="91" font-size="11" fill="#0d9488" font-weight="bold">subject_id (FK → subjects.id)</text>
  </g>

  <!-- 15. POSTS -->
  <g transform="translate(1100, 950)">
    <rect width="220" height="90" rx="8" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="220" height="34" rx="8" fill="url(#hdr5)"/>
    <text x="110" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📰 Новости (posts)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK), title, content, author_id</text>
  </g>

  <!-- 16. SCHOOL CONTACTS -->
  <g transform="translate(1100, 750)">
    <rect width="220" height="130" rx="8" fill="white" stroke="#5eead4" stroke-width="2"/>
    <rect width="220" height="34" rx="8" fill="url(#hdr3)"/>
    <text x="110" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="white">📞 Контакты (school_contacts)</text>
    <text x="14" y="55" font-size="11" fill="#64748b">id (PK)</text>
    <text x="14" y="73" font-size="11" fill="#1e293b" font-weight="bold">school_name, school_address</text>
    <text x="14" y="91" font-size="11" fill="#64748b">director, director_phone</text>
    <text x="14" y="109" font-size="11" fill="#64748b">vice_principal, psychologist…</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 1060)">
    <rect width="1340" height="30" rx="6" fill="#e2e8f0" opacity="0.6"/>
    <rect x="10" y="8" width="12" height="12" rx="2" fill="#6366f1"/>
    <text x="28" y="19" font-size="10" fill="#475569">auth_schema.ts</text>
    <rect x="140" y="8" width="12" height="12" rx="2" fill="#14b8a6"/>
    <text x="158" y="19" font-size="10" fill="#475569">diary-extra.ts</text>
    <rect x="270" y="8" width="12" height="12" rx="2" fill="#8b5cf6"/>
    <text x="288" y="19" font-size="10" fill="#475569">messages.ts + auth_schema</text>
    <rect x="430" y="8" width="12" height="12" rx="2" fill="#f59e0b"/>
    <text x="448" y="19" font-size="10" fill="#475569">Успеваемость</text>
    <line x1="580" y1="14" x2="630" y2="14" stroke="#64748b" stroke-width="1.5"/>
    <line x1="580" y1="14" x2="630" y2="14" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" stroke-dashoffset="-8"/>
    <text x="640" y="19" font-size="10" fill="#64748b">— прямая связь (сплошная) / — дальняя связь (пунктирная)</text>
  </g>
</svg>
