<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="500" height="680" fill="#f8fafc" rx="12"/>

  <text x="250" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Алгоритм защиты маршрутов (Next.js App Router)</text>

  <!-- Start -->
  <ellipse cx="250" cy="80" rx="90" ry="25" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="250" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Начало запроса</text>

  <!-- Arrow -->
  <line x1="250" y1="105" x2="250" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1. Try to open page -->
  <rect x="100" y="145" width="300" height="45" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Пользователь открывает страницу</text>
  <text x="250" y="179" text-anchor="middle" font-size="12" fill="#3b82f6">(например, /admin)</text>

  <!-- Arrow -->
  <line x1="250" y1="190" x2="250" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Check session -->
  <polygon points="250,230 370,265 250,300 130,265" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Сессия существует?</text>
  <text x="250" y="278" text-anchor="middle" font-size="10" fill="#b45309">(session проверяется)</text>

  <!-- No -> redirect -->
  <line x1="130" y1="265" x2="60" y2="265" stroke="#ef4444" stroke-width="2"/>
  <line x1="60" y1="265" x2="60" y2="350" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="255" text-anchor="end" font-size="12" fill="#dc2626" font-weight="bold">Нет</text>

  <rect x="20" y="350" width="80" height="45" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Редирект 307</text>
  <text x="60" y="384" text-anchor="middle" font-size="11" fill="#b91c1c">на /</text>

  <!-- Yes -> continue -->
  <line x1="250" y1="300" x2="250" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="315" font-size="12" fill="#16a34a" font-weight="bold">Да</text>

  <!-- 3. Check role -->
  <polygon points="250,340 370,375 250,410 130,375" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Роль соответствует?</text>
  <text x="250" y="388" text-anchor="middle" font-size="10" fill="#b45309">(role === admin?)</text>

  <!-- No -> redirect -->
  <line x1="370" y1="375" x2="440" y2="375" stroke="#ef4444" stroke-width="2"/>
  <line x1="440" y1="375" x2="440" y2="430" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="365" font-size="12" fill="#dc2626" font-weight="bold">Нет</text>

  <rect x="400" y="430" width="80" height="45" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="440" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Редирект 307</text>
  <text x="440" y="464" text-anchor="middle" font-size="11" fill="#b91c1c">на /</text>

  <!-- Yes -> show page -->
  <line x1="250" y1="410" x2="250" y2="450" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="425" font-size="12" fill="#16a34a" font-weight="bold">Да</text>

  <rect x="120" y="450" width="260" height="55" rx="10" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="250" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">✅ Загружается страница</text>
  <text x="250" y="490" text-anchor="middle" font-size="12" fill="#15803d">Серверный компонент рендерит HTML</text>

  <!-- End -->
  <line x1="250" y1="505" x2="250" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <ellipse cx="250" cy="575" rx="90" ry="25" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="250" y="581" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Конец запроса</text>

  <!-- Legend -->
  <text x="250" y="625" text-anchor="middle" font-size="11" fill="#94a3b8">Пример реализации в коде: if (!session || session.user.role !== "admin") redirect("/")</text>
  <text x="250" y="645" text-anchor="middle" font-size="10" fill="#cbd5e1">Код 307 — временный редирект (сохраняет метод HTTP)</text>
  <rect x="80" y="660" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="98" y="671" font-size="10" fill="#475569">Действие</text>
  <rect x="160" y="660" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706"/>
  <text x="178" y="671" font-size="10" fill="#475569">Условие</text>
  <rect x="240" y="660" width="12" height="12" rx="2" fill="#fee2e2" stroke="#ef4444"/>
  <text x="258" y="671" font-size="10" fill="#475569">Редирект</text>
  <rect x="320" y="660" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="338" y="671" font-size="10" fill="#475569">Успех</text>
</svg>